<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400"
     role="img" aria-labelledby="t52 d52" font-family="'Source Serif 4', Georgia, serif">
  <title id="t52">Figure 5.2 — Six layers: a pod inside a VM inside a pod inside a container</title>
  <desc id="d52">Six nested boxes. Outermost, the workstation, one laptop running Linux. Inside it, a Docker container which is the Kind node cluster2-control-plane. Inside that, a Kubernetes pod, the virt-launcher pod. Inside that, a virtual machine run by KubeVirt and QEMU, which is a node of the target k3s cluster. Inside that, a Kubernetes pod belonging to the target cluster. Innermost, the container that actually runs the workload.</desc>

  <style>
    :root, svg {
      --ink:#1B2430; --ink2:#4A5563; --ink3:#737C86; --rule:#D6DAD3;
      --accent:#1F5F4A; --accent-soft:#E3EDE7;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ink:#E6E8E3; --ink2:#A9B2BA; --ink3:#7E8892; --rule:#2A3642;
        --accent:#6FB79A; --accent-soft:#17302A;
      }
    }
    .box{fill:none;stroke:var(--rule);stroke-width:1.5;rx:5}
    .inner{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5;rx:5}
    .lbl{font-size:13px;fill:var(--ink);font-weight:600}
    .sub{font-size:11px;fill:var(--ink3);
         font-family:'IBM Plex Mono',Menlo,Consolas,monospace}
    .n{font-size:11px;fill:var(--accent);font-weight:700;
       font-family:'IBM Plex Mono',Menlo,Consolas,monospace}
    .cap{font-size:12px;fill:var(--ink3);font-style:italic}
  </style>

  <!-- 1 workstation -->
  <rect class="box" x="20" y="34" width="680" height="316"/>
  <text class="n"   x="34" y="54">1</text>
  <text class="lbl" x="50" y="54">The workstation</text>
  <text class="sub" x="50" y="70">one laptop · Linux · 24 threads, 29.96 GiB</text>

  <!-- 2 docker container = kind node -->
  <rect class="box" x="44" y="82" width="632" height="250"/>
  <text class="n"   x="58" y="102">2</text>
  <text class="lbl" x="74" y="102">A container</text>
  <text class="sub" x="74" y="118">the Kind node · cluster2-control-plane</text>

  <!-- 3 pod = virt-launcher -->
  <rect class="box" x="68" y="130" width="584" height="184"/>
  <text class="n"   x="82" y="150">3</text>
  <text class="lbl" x="98" y="150">A Kubernetes pod</text>
  <text class="sub" x="98" y="166">virt-launcher · reserves 8,484 Mi for the VM</text>

  <!-- 4 VM -->
  <rect class="box" x="92" y="178" width="536" height="118"/>
  <text class="n"   x="106" y="198">4</text>
  <text class="lbl" x="122" y="198">A virtual machine</text>
  <text class="sub" x="122" y="214">KubeVirt + QEMU · a node of the target k3s cluster</text>

  <!-- 5 pod in target cluster -->
  <rect class="box" x="116" y="226" width="488" height="52"/>
  <text class="n"   x="130" y="246">5</text>
  <text class="lbl" x="146" y="246">A Kubernetes pod</text>
  <text class="sub" x="146" y="262">scheduled by the target cluster's own control plane</text>

  <!-- 6 container -->
  <rect class="inner" x="392" y="234" width="196" height="34"/>
  <text class="n"   x="406" y="256">6</text>
  <text class="lbl" x="422" y="256">A container</text>
  <text class="sub" x="500" y="256">the workload</text>

  <text class="cap" x="20" y="374">Kubernetes manages virtual machines, which run Kubernetes. Every layer is real, and every</text>
  <text class="cap" x="20" y="390">layer has its own idea of what "Ready" means — which is Chapter 5's subject.</text>
</svg>
