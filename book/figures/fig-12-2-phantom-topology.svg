<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380"
     role="img" aria-labelledby="t122 d122" font-family="'Source Serif 4', Georgia, serif">
  <title id="t122">Figure 12.2 — A topology view labelled "live", drawing fourteen things that do not exist</title>
  <desc id="d122">A schematic of the console's topology panel. Of twenty-one nodes drawn under a badge reading LIVE, seven correspond to something real and fourteen do not; thirteen of the fourteen are drawn as healthy. Two causes are annotated: virtual machines are matched by exact name, so target-cluster-cp never matches the real target-cluster-cp-s9j8h, and a query against a namespace that no longer exists returns an empty list, which the panel reads as success rather than as not-found.</desc>

  <style>
    :root, svg {
      --ink:#1B2430; --ink2:#4A5563; --ink3:#737C86; --rule:#D6DAD3;
      --accent:#1F5F4A; --accent-soft:#E3EDE7; --flag:#A8442A; --panel:#EAEEE8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ink:#E6E8E3; --ink2:#A9B2BA; --ink3:#7E8892; --rule:#2A3642;
        --accent:#6FB79A; --accent-soft:#17302A; --flag:#E08A6B; --panel:#1B2732;
      }
    }
    .panel{fill:var(--panel);stroke:var(--rule);stroke-width:1;rx:4}
    .real{fill:var(--accent);opacity:.75;stroke:var(--accent);stroke-width:1}
    .ghost{fill:none;stroke:var(--flag);stroke-width:1.5;stroke-dasharray:3 3}
    .link{stroke:var(--rule);stroke-width:1}
    .badge{fill:var(--accent);opacity:.18;stroke:var(--accent);stroke-width:1;rx:3}
    .badgetxt{font-size:11px;fill:var(--accent);font-weight:700;letter-spacing:.08em;
              font-family:'IBM Plex Mono',Menlo,Consolas,monospace}
    .lbl{font-size:12px;fill:var(--ink2)}
    .flag{font-size:12px;fill:var(--flag)}
    .flagline{stroke:var(--flag);stroke-width:1;fill:none}
    .mono{font-family:'IBM Plex Mono',Menlo,Consolas,monospace;font-size:11px;fill:var(--ink)}
    .hdr{font-size:13px;fill:var(--ink);font-weight:600}
    .cap{font-size:12px;fill:var(--ink3);font-style:italic}
    .key{font-size:11px;fill:var(--ink3)}
  </style>

  <!-- console panel -->
  <rect class="panel" x="20" y="20" width="430" height="250"/>
  <text class="hdr" x="36" y="44">Service topology</text>
  <rect class="badge" x="150" y="31" width="44" height="17"/>
  <text class="badgetxt" x="172" y="44" text-anchor="middle">LIVE</text>

  <!-- links -->
  <g class="link">
    <line x1="90" y1="100" x2="170" y2="100"/><line x1="170" y1="100" x2="250" y2="100"/>
    <line x1="250" y1="100" x2="330" y2="100"/><line x1="90" y1="160" x2="170" y2="160"/>
    <line x1="170" y1="160" x2="250" y2="160"/><line x1="250" y1="160" x2="330" y2="160"/>
    <line x1="90" y1="220" x2="170" y2="220"/><line x1="170" y1="220" x2="250" y2="220"/>
    <line x1="250" y1="220" x2="330" y2="220"/><line x1="330" y1="100" x2="400" y2="160"/>
    <line x1="330" y1="220" x2="400" y2="160"/>
  </g>

  <!-- 7 real nodes (filled) -->
  <g>
    <circle class="real" cx="90"  cy="100" r="11"/>
    <circle class="real" cx="170" cy="100" r="11"/>
    <circle class="real" cx="250" cy="100" r="11"/>
    <circle class="real" cx="90"  cy="160" r="11"/>
    <circle class="real" cx="170" cy="160" r="11"/>
    <circle class="real" cx="90"  cy="220" r="11"/>
    <circle class="real" cx="400" cy="160" r="11"/>
  </g>

  <!-- 14 phantom nodes (dashed outline) -->
  <g>
    <circle class="ghost" cx="330" cy="100" r="11"/>
    <circle class="ghost" cx="250" cy="160" r="11"/>
    <circle class="ghost" cx="330" cy="160" r="11"/>
    <circle class="ghost" cx="170" cy="220" r="11"/>
    <circle class="ghost" cx="250" cy="220" r="11"/>
    <circle class="ghost" cx="330" cy="220" r="11"/>
    <circle class="ghost" cx="130" cy="130" r="11"/>
    <circle class="ghost" cx="210" cy="130" r="11"/>
    <circle class="ghost" cx="290" cy="130" r="11"/>
    <circle class="ghost" cx="130" cy="190" r="11"/>
    <circle class="ghost" cx="210" cy="190" r="11"/>
    <circle class="ghost" cx="290" cy="190" r="11"/>
    <circle class="ghost" cx="370" cy="130" r="11"/>
    <circle class="ghost" cx="370" cy="190" r="11"/>
  </g>

  <!-- key -->
  <g>
    <circle class="real" cx="40" cy="252" r="7"/>
    <text class="key" x="54" y="256">7 real</text>
    <circle class="ghost" cx="120" cy="252" r="7"/>
    <text class="key" x="134" y="256">14 drawn, nothing behind them — 13 of them green</text>
  </g>

  <!-- causes -->
  <text class="hdr" x="472" y="44">Two causes</text>

  <path class="flagline" d="M452 100 L466 100"/>
  <text class="flag" x="472" y="80">Matched by exact name</text>
  <rect class="panel" x="472" y="88" width="228" height="56"/>
  <text class="mono" x="484" y="108">looks for: target-cluster-cp</text>
  <text class="mono" x="484" y="126">actual:    target-cluster-cp-s9j8h</text>
  <text class="lbl"  x="472" y="162">No match, so the panel invents the node</text>
  <text class="lbl"  x="472" y="178">it expected rather than reporting none.</text>

  <path class="flagline" d="M452 220 L466 220"/>
  <text class="flag" x="472" y="212">An empty list reads as success</text>
  <rect class="panel" x="472" y="220" width="228" height="38"/>
  <text class="mono" x="484" y="244">GET …/namespaces/sample/… → [ ]</text>
  <text class="lbl"  x="472" y="276">The namespace no longer exists. Nothing</text>
  <text class="lbl"  x="472" y="292">errored, so nothing looked wrong.</text>

  <text class="cap" x="20" y="326">The mesh underneath is real: failover measured 30 of 30 by status code. The picture of it was not.</text>
  <text class="cap" x="20" y="342">A view labelled "live" should distinguish three states — healthy, unhealthy, and not found. This one</text>
  <text class="cap" x="20" y="358">had two, so "not found" was drawn in the colour of "healthy".</text>
  <text class="cap" x="20" y="374">Source: ui/backend/handlers/mesh.go, read 17 September 2026.</text>
</svg>
