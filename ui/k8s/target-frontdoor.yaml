# Front door for the target cluster's API in on-demand mode (POOL_MODE=ondemand).
#
# 172.18.255.223:6443 -> the kubeui backend on the host (172.18.0.1:16443), which
# splices to the real API on 172.18.255.215 when the cluster is up and builds it
# when it is not. See ui/backend/handlers/activator.go.
#
# Selectorless Service + hand-written EndpointSlice, because the backend runs on
# the host in dev (run-ui.sh), not in a pod. Applied by run-ui.sh.
---
apiVersion: v1
kind: Service
metadata:
  name: target-cluster-frontdoor
  namespace: default
  annotations:
    metallb.universe.tf/loadBalancerIPs: "172.18.255.223"
spec:
  type: LoadBalancer
  ports:
    - name: https
      port: 6443
      targetPort: 16443
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: target-cluster-frontdoor-host
  namespace: default
  labels:
    kubernetes.io/service-name: target-cluster-frontdoor
addressType: IPv4
ports:
  - name: https
    port: 16443
    protocol: TCP
endpoints:
  - addresses:
      - 172.18.0.1
    conditions:
      ready: true
