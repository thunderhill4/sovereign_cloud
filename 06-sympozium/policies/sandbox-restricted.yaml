---
apiVersion: sympozium.ai/v1alpha1
kind: SympoziumPolicy
metadata:
  name: sandbox-restricted
  namespace: sympozium-system
spec:
  featureGates:
    browser-automation: false
    code-execution: true
    file-access: true
    sub-agents: true
  networkPolicy:
    allowDNS: true
    allowEventBus: true
    denyAll: true
    allowedEgress:
      - host: 172.18.0.1
        port: 11434
      - host: kubernetes.default.svc.cluster.local
        port: 443
  sandboxPolicy:
    allowHostMounts: false
    maxCPU: "4"
    maxMemory: 8Gi
    required: false
    seccompProfile:
      type: RuntimeDefault
  subagentPolicy:
    maxConcurrent: 5
    maxDepth: 3
  # 0.12.0+: k8s-ops asks for secrets and pods/exec RBAC. Off by default now;
  # without this the cluster2-agent and mesh-sre-agent kubectl sidecars lose
  # secret reads and exec. Trade-off: an agent driving k8s-ops can read model
  # keys in sympozium-system. Remove on pre-0.12 clusters (the field is unknown there).
  skillPolicy:
    allowSecretAccess: true
  toolGating:
    defaultAction: allow
    rules:
      - action: deny
        tool: fetch_url
