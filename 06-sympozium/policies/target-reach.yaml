---
apiVersion: sympozium.ai/v1alpha1
kind: SympoziumPolicy
metadata:
  name: target-reach
  namespace: sympozium-system
spec:
  featureGates:
    browser-automation: false
    code-execution: true
    file-access: true
    sub-agents: true
  networkPolicy:
    allowDNS: true
    allowEventBus: true
    denyAll: true
    allowedEgress:
      - host: 172.18.0.1
        port: 11434
      - host: kubernetes.default.svc.cluster.local
        port: 443
      - host: 172.18.255.215
        port: 6443
      # On-demand front door (ui/k8s/target-frontdoor.yaml): where the mounted
      # kubeconfig points when the backend runs with POOL_MODE=ondemand.
      - host: 172.18.255.223
        port: 6443
      # ...and the host listener that Service resolves to, for policy engines
      # that match the destination after kube-proxy's DNAT.
      - host: 172.18.0.1
        port: 16443
  sandboxPolicy:
    allowHostMounts: false
    maxCPU: "4"
    maxMemory: 8Gi
    required: false
    seccompProfile:
      type: RuntimeDefault
  subagentPolicy:
    maxConcurrent: 5
    maxDepth: 3
  toolGating:
    defaultAction: allow
    rules:
      - action: deny
        tool: fetch_url
