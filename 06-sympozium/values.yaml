# Helm values for Sympozium control plane.
# Reference: https://deploy.sympozium.ai/docs/reference/helm

# LLM provider config. Sympozium supports any OpenAI-compatible endpoint.
# Default here targets an Ollama instance reachable from cluster2 — adjust to
# your environment (localhost:11434 only works if the pod can route to the host).
#
# For a remote provider (Anthropic / OpenAI / Azure), set `apiKey` and update
# `baseURL` accordingly.
llm:
  provider: ollama
  # In-cluster shim Service (06-sympozium/host-ollama-service.yaml) whose
  # Endpoints point at the docker bridge gateway 172.18.0.1:11434. AgentRun
  # pods can't dial the gateway directly under kindnet NetworkPolicy
  # enforcement; the Service IP path is covered by `sympozium-allow-ollama`.
  baseURL: http://host-ollama.sympozium-system.svc.cluster.local:11434/v1
  model: llama3.2
  # apiKey: ""                    # required for OpenAI/Anthropic; unused for Ollama

# Control plane components.
apiserver:
  replicas: 1
  service:
    type: ClusterIP   # set to LoadBalancer + metallb annotation if external admin access is needed

controller:
  replicas: 1

# NATS event bus (bundled). Leave defaults unless cluster has resource limits.

nats:
  enabled: true
  # 0.10.57 defaults nats.auth.enabled to true and wires NATS_USERNAME/PASSWORD
  # into the controller and llmfit-daemonset -- but NOT into the built-in
  # web-endpoint SkillPack's sidecar env (still just EVENT_BUS_URL, no creds).
  # Every served agent's web-proxy sidecar then dials NATS unauthenticated and
  # is rejected (`nats` pod logs: "authentication error"), crash-looping with
  # exit 2 and zero log output -- same signature as the :latest-skew landmine,
  # different cause. Disabled here to restore the known-working behavior this
  # repo has always run on. NATS is ClusterIP-only, internal to sympozium-system,
  # never exposed via MetalLB -- same demo-simplicity trade-off as the fixed CAs
  # elsewhere in this repo. Re-evaluate on a future chart bump: if web-endpoint's
  # sidecar env gets NATS credentials upstream, auth can go back on.
  auth:
    enabled: false
# GPU/DRA subchart, new and enabled-by-default as of 0.10.47. Disabled here to
# keep the 0.10.38 -> 0.10.47 upgrade's blast radius on the control plane only.
# The Kind node passes /dev/nvidia* through but has no nvidia-smi / NVML (see
# fix-llmfit-nvidia-smi.sh), so DRA device discovery has nothing to bind to.
# Evaluate separately: helm upgrade ... --set llmfit-dra.enabled=true
llmfit-dra:
  enabled: false
